<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESABCC RefManager</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

</head>
<body>
  <div id="app">
    <!-- Connection status -->
    <div id="connectionStatus" class="status">Connecting...</div>

    <!-- Report Plan scope -->
    <div id="reportScope" class="report-scope" data-state="loading" aria-live="polite">
      <div class="report-scope-row">
        <div class="report-scope-info">
          <div class="report-scope-label">Report</div>
          <div id="reportScopeName" class="report-scope-name">Loading…</div>
          <div id="reportScopeStats" class="report-scope-stats"></div>
        </div>
        <div class="report-scope-actions">
          <button id="reportScopeChange" class="btn btn-sm btn-ghost" type="button"
                  onclick="openReportPicker()">Change</button>
          <button id="reportScopeClear" class="btn btn-sm btn-ghost hidden" type="button"
                  onclick="clearReportScope()">Clear</button>
        </div>
      </div>
      <div id="reportScopeError" class="report-scope-error hidden" role="alert"></div>
    </div>

    <!-- Report picker dialog -->
    <div id="reportPicker" class="report-picker hidden" role="dialog" aria-modal="true"
         aria-labelledby="reportPickerTitle">
      <div class="report-picker-panel">
        <div class="report-picker-header">
          <span id="reportPickerTitle">Pick a report plan</span>
          <button class="btn btn-ghost btn-sm" type="button" onclick="closeReportPicker()"
                  aria-label="Close">&times;</button>
        </div>
        <input id="reportPickerSearch" class="report-picker-search" type="text"
               placeholder="Filter by name…" />
        <ul id="reportPickerList" class="report-picker-list">
          <li class="report-picker-empty">Loading plans…</li>
        </ul>
        <div class="report-picker-footer">
          <button class="btn btn-sm btn-ghost" type="button" onclick="reloadReportPickerList()">Refresh</button>
        </div>
      </div>
    </div>

    <!-- Tab navigation -->
    <div class="tabs">
      <button class="tab active" data-tab="search" onclick="switchTab('search')">Search &amp; Insert</button>
      <button class="tab" data-tab="bibliography" onclick="switchTab('bibliography')">Bibliography</button>
      <button class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </div>

    <!-- Search & Insert Tab -->
    <div id="tab-search" class="tab-content active">
      <div class="search-container">
        <input type="text" class="search-box" id="searchInput"
               placeholder="Search references (author, title, year...)">
        <div id="searchSpinner" class="spinner hidden"></div>
      </div>

      <ul class="ref-list" id="refList">
        <li class="ref-empty">Type to search your reference library</li>
      </ul>

      <!-- Multi-citation basket -->
      <div id="citationBasket" class="citation-basket hidden">
        <div class="basket-header">
          <span id="basketCount">0</span> selected
          <button class="btn btn-sm btn-primary" onclick="insertMultiCitation()">Insert Group Citation</button>
          <button class="btn btn-sm btn-ghost" onclick="clearBasket()">Clear</button>
        </div>
        <ul id="basketList" class="basket-list"></ul>
      </div>
    </div>

    <!-- Bibliography Tab -->
    <div id="tab-bibliography" class="tab-content">
      <div class="bib-actions">
        <button class="btn btn-primary btn-full" onclick="generateBibliography()">
          Generate / Update Bibliography
        </button>
        <button class="btn btn-secondary btn-full" onclick="refreshAllCitations()">
          Refresh All Citations
        </button>
      </div>

      <div id="docCitations" class="doc-citations">
        <p class="text-muted">Click a button above to scan the document.</p>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content">
      <div class="setting-group">
        <label class="setting-label">Citation Style</label>
        <select id="styleSelect" class="setting-select" onchange="onStyleChange()">
          <option value="apa">APA 7th Edition</option>
          <option value="chicago-author-date">Chicago (Author-Date)</option>
          <option value="ieee">IEEE</option>
          <option value="vancouver">Vancouver</option>
          <option value="harvard-cite-them-right">Harvard</option>
          <option value="nature">Nature</option>
          <option value="mla">MLA 9th Edition</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Library</label>
        <select id="librarySelect" class="setting-select">
          <option value="">Loading libraries...</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Bridge Service</label>
        <div id="bridgeStatus" class="status-badge status-disconnected">Not connected</div>
        <button class="btn btn-sm btn-ghost" onclick="checkBridgeConnection()">Re-check</button>
      </div>

      <div class="setting-group">
        <label class="setting-label">Supabase</label>
        <div id="supabaseStatus" class="status-badge status-disconnected">Not connected</div>
      </div>

      <div class="setting-group">
        <label class="setting-label">Document Info</label>
        <div id="docInfo" class="text-muted">-</div>
      </div>
    </div>
  </div>
</body>
</html>

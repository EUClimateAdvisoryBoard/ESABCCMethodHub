name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

# Deployment is handled by Vercel's GitHub integration (existing flow) OR
# by .github/workflows/self-hosted-deploy.yml (EEA-hosted flow). Enable
# whichever target IT has approved.

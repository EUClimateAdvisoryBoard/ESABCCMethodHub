# Nightly off-site backup of all content-analysis, project-workspace and
# reference-manager data.
#
# Exports every content_analysis_*, pw_* and reference-manager table from
# Supabase (segments, summaries, general notes, overall tags, codes, workspace
# corpus, ingested documents, references, annotations, comments, collections,
# profiles, …) and commits the snapshot to a PRIVATE backup repository — one
# commit per night, so the full history of the data is kept forever and any
# past day can be recovered with `git checkout`.
#
# PRIVACY: the export runs with the service-role key and includes tables that
# hold personal data (profiles, annotations, comments, activity_log). This
# repository is public, so snapshots are NEVER committed to a branch here and
# NEVER uploaded as workflow artifacts (public-repo artifacts are downloadable
# by any GitHub user). The private backup repo is the only destination.
#
# Restore: scripts/restore-content-analysis-backup.mjs <snapshot-dir>
#
# Required repository secrets:
#   SUPABASE_URL                (or NEXT_PUBLIC_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY   (service-role — RLS must not hide rows from a backup)
#   BACKUP_REPO                 private repo for snapshots, e.g. "EUClimateAdvisoryBoard/methodhub-data-backups"
#   BACKUP_REPO_TOKEN           token with contents:write on BACKUP_REPO
#                               (fine-grained PAT or org token)
#
# The job FAILS LOUDLY if secrets are missing or any existing table cannot be
# read in full — a backup that silently skips data is worse than no backup.

name: Content Analysis Daily Backup

on:
  schedule:
    # 03:30 UTC nightly — after the working day in all EU timezones, away from
    # the busy on-the-hour scheduling slots (less GitHub-side delay).
    - cron: '30 3 * * *'
  workflow_dispatch: # manual trigger, e.g. right before a risky migration

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export all backed-up tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-content-analysis.mjs backup-out

      - name: Commit snapshot to the private backup repository
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_REPO:-}" ] || [ -z "${BACKUP_REPO_TOKEN:-}" ]; then
            echo "::error title=Backup destination not configured::Set the BACKUP_REPO (e.g. org/methodhub-data-backups, must be PRIVATE) and BACKUP_REPO_TOKEN secrets. The snapshot contains personal data and is never committed to this public repository."
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" wt-backup
          cd wt-backup
          # A brand-new backup repo may have no commits yet — start main fresh.
          git checkout main 2>/dev/null || git checkout -b main
          cd ..

          # Shrink guard: compare row counts against the previous snapshot.
          # Large drops are committed anyway (the current state must still be
          # captured, and yesterday's data stays in git history) but flagged
          # prominently so a mass-deletion is noticed the next morning.
          WARN=""
          if [ -f wt-backup/tables/manifest.json ]; then
            WARN=$(node -e '
              const fs = require("fs");
              const prev = JSON.parse(fs.readFileSync("wt-backup/tables/manifest.json", "utf8"));
              const next = JSON.parse(fs.readFileSync("backup-out/manifest.json", "utf8"));
              const drops = [];
              for (const [t, p] of Object.entries(prev.tables ?? {})) {
                const n = next.tables?.[t];
                if (!p || p.missing || !n) continue;
                const before = p.rows ?? 0, after = n.missing ? 0 : (n.rows ?? 0);
                if (before >= 20 && after < before * 0.7) drops.push(`${t}: ${before} -> ${after}`);
              }
              process.stdout.write(drops.join("; "));
            ')
          fi
          if [ -n "$WARN" ]; then
            echo "::warning title=Backup row counts dropped sharply::$WARN — check for accidental data loss; previous snapshots remain in the backup repo history."
          fi

          mkdir -p wt-backup/tables
          rsync -a --delete backup-out/ wt-backup/tables/

          cat > wt-backup/README.md <<'EOF'
          # Method Hub data backups (automated, PRIVATE)

          Nightly snapshots of every content_analysis_*, pw_* and
          reference-manager Supabase table, written by the
          `content-analysis-backup.yml` workflow in the ESABCCMethodHub repo.
          One JSON-Lines file per table under `tables/`, plus a
          `manifest.json` with row counts.

          These snapshots contain personal data (profiles, annotation and
          comment authorship, activity log). KEEP THIS REPOSITORY PRIVATE.

          Each night is a commit — use `git log -- tables` to find a date and
          `git checkout <sha> -- tables` to pull that day's state. Restore
          into Supabase (or any PostgREST-fronted Postgres) with the script
          from the main repo:

              SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
                node scripts/restore-content-analysis-backup.mjs tables

          Do not edit this repository by hand.
          EOF

          cd wt-backup
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes since the last snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SUFFIX=""
          if [ -n "$WARN" ]; then SUFFIX=" [ROW COUNTS DROPPED — REVIEW]"; fi
          git commit -m "backup: method hub data snapshot $(date -u +%Y-%m-%d)${SUFFIX} [automated]"
          git push origin main

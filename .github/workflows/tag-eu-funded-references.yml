name: Tag EU-funded references

# Runs scripts/tag-eu-funded-references.mjs on a GitHub-hosted runner (which can
# reach api.crossref.org, unlike the restricted dev sandbox), then commits the
# resulting tag map + report back to the branch the workflow is triggered from.
#
# Runs automatically when the script or this workflow changes on the working
# branch, and can also be triggered manually from the Actions tab. The runner's
# commit-back uses GITHUB_TOKEN, which (by GitHub design) does not re-trigger
# this workflow, so there's no risk of a loop; the path filter keeps it from
# firing on the generated outputs too.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/lucid-cori-31lar7
    paths:
      - scripts/tag-eu-funded-references.mjs
      - .github/workflows/tag-eu-funded-references.yml

permissions:
  contents: write

jobs:
  tag-and-commit:
    runs-on: ubuntu-latest
    # Opt the bundled actions (checkout, setup-node) into the Node 24 runtime;
    # Node 20 is deprecated on GitHub runners from mid-June 2026.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The script only uses Node built-ins + global fetch, so no install step.
      - name: Tag EU-funded references from CrossRef
        run: node scripts/tag-eu-funded-references.mjs

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/data/reference-funding-tags.json docs/reference/eu-funding-tags.md)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates to current branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/reference-funding-tags.json docs/reference/eu-funding-tags.md
          git commit -m "chore: tag EU-funded references from CrossRef [automated]"
          branch="${GITHUB_REF#refs/heads/}"
          # The target branch (especially a busy main) can advance between
          # checkout and push, which rejects the push as non-fast-forward.
          # Rebase the single automated commit onto the latest tip and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${branch} and retrying."
            git pull --rebase origin "${branch}"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push automated tag update after 5 attempts."
          exit 1


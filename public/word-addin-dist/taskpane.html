<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESABCC RefManager</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer="defer" src="taskpane.bundle.js"></script></head><body><div id="app"><div id="connectionStatus" class="status">Connecting...</div><div class="tabs"><button class="tab active" data-tab="search" onclick="switchTab('search')">Search &amp; Insert</button> <button class="tab" data-tab="bibliography" onclick="switchTab('bibliography')">Bibliography</button> <button class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</button></div><div id="tab-search" class="tab-content active"><div class="search-container"><input class="search-box" id="searchInput" placeholder="Search references (author, title, year...)"><div id="searchSpinner" class="spinner hidden"></div></div><div id="chapterFilterWrap" class="chapter-filter hidden"><label for="chapterFilter">Chapter</label> <select id="chapterFilter" class="chapter-filter-select"><option value="">All chapters</option></select></div><ul class="ref-list" id="refList"><li class="ref-empty">Type to search your reference library</li></ul><div id="citationBasket" class="citation-basket hidden"><div class="basket-header"><span id="basketCount">0</span> selected <button class="btn btn-sm btn-primary" onclick="insertMultiCitation()">Insert Group Citation</button> <button class="btn btn-sm btn-ghost" onclick="clearBasket()">Clear</button></div><ul id="basketList" class="basket-list"></ul></div></div><div id="tab-bibliography" class="tab-content"><div class="bib-actions"><button class="btn btn-primary btn-full" onclick="generateBibliography()">Generate / Update Bibliography</button> <button class="btn btn-secondary btn-full" onclick="refreshAllCitations()">Refresh All Citations</button></div><div id="docCitations" class="doc-citations"><p class="text-muted">Click a button above to scan the document.</p></div></div><div id="tab-settings" class="tab-content"><div class="setting-group"><label class="setting-label">Citation Style</label> <select id="styleSelect" class="setting-select" onchange="onStyleChange()"><option value="apa">APA 7th Edition</option><option value="chicago-author-date">Chicago (Author-Date)</option><option value="ieee">IEEE</option><option value="vancouver">Vancouver</option><option value="harvard-cite-them-right">Harvard</option><option value="nature">Nature</option><option value="mla">MLA 9th Edition</option></select></div><div class="setting-group"><label class="setting-label">Library</label> <select id="librarySelect" class="setting-select"><option value="">Loading libraries...</option></select></div><div class="setting-group"><label class="setting-label">Bridge Service</label><div id="bridgeStatus" class="status-badge status-disconnected">Not connected</div><button class="btn btn-sm btn-ghost" onclick="checkBridgeConnection()">Re-check</button></div><div class="setting-group"><label class="setting-label">Supabase</label><div id="supabaseStatus" class="status-badge status-disconnected">Not connected</div></div><div class="setting-group"><label class="setting-label">Document Info</label><div id="docInfo" class="text-muted">-</div></div></div></div></body></html>

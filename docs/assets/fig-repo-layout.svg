<!--
  Repository layout — what lives where and why.
  Four zones: the Next.js app (src/), the scope-parked beta tree,
  the documentation site + narrative, and the operational scripts /
  deployment artefacts. Colour-coded by ownership (CCE5 code, IT
  handoff, data pipelines, docs).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 760"
     role="img"
     aria-label="Repository layout — four zones: Next.js app in src/, scope-parked beta tree in beta/, documentation in docs/, operational scripts and container assets at the repo root.">
  <title>Repository layout</title>

  <defs>
    <style>
      .h1     { font-family: "Inter", system-ui, sans-serif; font-weight: 700; fill: #3D5584; }
      .sub    { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #5B6B7B; }
      .code   { font-family: "JetBrains Mono", monospace; font-weight: 600; fill: #8A95A3; letter-spacing: 0.14em; text-transform: uppercase; }
      .path   { font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
      .label  { font-family: "Inter", sans-serif; font-size: 11.5px; fill: #3D5584; }
      .zone-app  { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.4; fill-opacity: 0.45; }
      .zone-beta { fill: #FFEEE3; stroke: #F26119; stroke-width: 1.2; stroke-dasharray: 5 4; fill-opacity: 0.4; }
      .zone-docs { fill: #E4ECEE; stroke: #608C95; stroke-width: 1.4; fill-opacity: 0.5; }
      .zone-ops  { fill: #EDE7F6; stroke: #4527A0; stroke-width: 1.2; fill-opacity: 0.4; }
      .tile      { fill: #FFFFFF; stroke: #D9DCDE; stroke-width: 1; }
    </style>
  </defs>

  <text class="h1" font-size="22" x="60" y="52">Repository layout</text>
  <text class="sub" font-size="13" x="60" y="76">Four zones. A reviewer should be able to tell what ships vs. what is parked from the folder names alone.</text>

  <!-- Zone 1 · Next.js app (top-left, big) -->
  <g transform="translate(60, 110)">
    <rect class="zone-app" x="0" y="0" width="620" height="270" rx="8" />
    <text class="code" font-size="11" fill="#0D47A1" x="16" y="28">ZONE 1 · THE SHIPPED APP</text>
    <text class="h1" font-size="17" x="16" y="54">src/</text>

    <g transform="translate(16, 76)" class="path">
      <text y="0" fill="#0D47A1" font-weight="700">app/</text>
      <text y="20" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">page.tsx</tspan>                 hub / module index</text>
      <text y="40" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">references/</tspan>              M · 01</text>
      <text y="60" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">scenarios/</tspan>               M · 02</text>
      <text y="80" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">news-feed/</tspan>               M · 03</text>
      <text y="100" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">policy-navigator/</tspan>        M · 04</text>
      <text y="120" x="18" fill="#3D5584">├─ <tspan fill="#0D47A1">content-analysis/</tspan>        M · 05</text>
      <text y="140" x="18" fill="#3D5584">└─ api/                     server routes</text>
      <text y="168" fill="#0D47A1" font-weight="700">components/</text>
      <text y="186" x="18" fill="#3D5584">shared React components</text>
    </g>
  </g>

  <!-- Zone 2 · Beta (top-right) -->
  <g transform="translate(700, 110)">
    <rect class="zone-beta" x="0" y="0" width="440" height="270" rx="8" />
    <text class="code" font-size="11" fill="#B84414" x="16" y="28">ZONE 2 · SCOPE-PARKED</text>
    <text class="h1" font-size="17" x="16" y="54">beta/</text>

    <g transform="translate(16, 76)" class="path">
      <text y="0" fill="#B84414" font-weight="700">README.md</text>
      <text y="18" x="0" fill="#3D5584" font-family="Inter,sans-serif" font-size="11.5">promotion recipe + why parked</text>

      <text y="44" fill="#B84414" font-weight="700">modules/</text>
      <text y="64" x="18" fill="#3D5584">├─ brussels-bulletin/</text>
      <text y="82" x="18" fill="#3D5584">├─ climate-adaptation/</text>
      <text y="100" x="18" fill="#3D5584">├─ climate-finance/</text>
      <text y="118" x="18" fill="#3D5584">├─ energy-system/</text>
      <text y="136" x="18" fill="#3D5584">├─ fact-sheets/</text>
      <text y="154" x="18" fill="#3D5584">├─ faq/</text>
      <text y="172" x="18" fill="#3D5584">├─ maritime-aviation/</text>
      <text y="190" x="18" fill="#3D5584">└─ media-monitoring/</text>
    </g>
    <text class="label" font-style="italic" x="16" y="260">Unrouted by Next.js · promoted with one git mv.</text>
  </g>

  <!-- Zone 3 · Docs (bottom-left) -->
  <g transform="translate(60, 410)">
    <rect class="zone-docs" x="0" y="0" width="540" height="280" rx="8" />
    <text class="code" font-size="11" fill="#608C95" x="16" y="28">ZONE 3 · DOCUMENTATION</text>
    <text class="h1" font-size="17" x="16" y="54">docs/ + mkdocs.yml</text>

    <g transform="translate(16, 76)" class="path" font-size="11.5">
      <text y="0" fill="#608C95" font-weight="700">mkdocs.yml</text>
      <text y="16" x="18" fill="#3D5584" font-family="Inter,sans-serif">site config · ESABCC palette</text>
      <text y="36" fill="#608C95" font-weight="700">docs/</text>
      <text y="54" x="18" fill="#3D5584">├─ index.md                 landing</text>
      <text y="70" x="18" fill="#3D5584">├─ overview/</text>
      <text y="86" x="18" fill="#3D5584">├─ modules/                 5 deep dives</text>
      <text y="102" x="18" fill="#3D5584">├─ infrastructure/          stewardship · AI · GDPR</text>
      <text y="118" x="18" fill="#3D5584">├─ vision/                  blueprint · roadmap</text>
      <text y="134" x="18" fill="#3D5584">├─ assets/                  SVG figures · logo</text>
      <text y="150" x="18" fill="#3D5584">├─ stylesheets/extra.css    theme overrides</text>
      <text y="166" x="18" fill="#3D5584">└─ overrides/               footer partial</text>
    </g>
  </g>

  <!-- Zone 4 · Ops (bottom-right) -->
  <g transform="translate(620, 410)">
    <rect class="zone-ops" x="0" y="0" width="520" height="280" rx="8" />
    <text class="code" font-size="11" fill="#311B92" x="16" y="28">ZONE 4 · OPS + INGESTION</text>
    <text class="h1" font-size="17" x="16" y="54">scripts/ · supabase/ · Dockerfile</text>

    <g transform="translate(16, 76)" class="path" font-size="11.5">
      <text y="0" fill="#311B92" font-weight="700">scripts/</text>
      <text y="16" x="18" fill="#3D5584">├─ fetch-eurlex-texts.js · fetch-news.js</text>
      <text y="32" x="18" fill="#3D5584">├─ fetch_iiasa_data.py · generate-daily-summary.js</text>
      <text y="48" x="18" fill="#3D5584">├─ migrate-to-postgres/     parity tests</text>
      <text y="64" x="18" fill="#3D5584">└─ it-handoff/              apply-schema, backup</text>

      <text y="90" fill="#311B92" font-weight="700">supabase/</text>
      <text y="106" x="18" fill="#3D5584">└─ migrations/              applied in order on boot</text>

      <text y="132" fill="#311B92" font-weight="700">Dockerfile · docker-compose.yml · next.config.js</text>
      <text y="148" x="18" fill="#3D5584" font-family="Inter,sans-serif">multi-stage build · standalone output</text>

      <text y="172" fill="#311B92" font-weight="700">.github/workflows/</text>
      <text y="188" x="18" fill="#3D5584">docs.yml · deploy.yml · daily-updates.yml · …</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 732)" class="label">
    <rect x="0"   y="-10" width="14" height="14" fill="#E3F2FD" stroke="#1565C0"/>    <text x="20"  y="0">Shipped (src/)</text>
    <rect x="140" y="-10" width="14" height="14" fill="#FFEEE3" stroke="#F26119" stroke-dasharray="3 3"/>  <text x="160" y="0">Parked (beta/)</text>
    <rect x="290" y="-10" width="14" height="14" fill="#E4ECEE" stroke="#608C95"/>    <text x="310" y="0">Documentation (docs/)</text>
    <rect x="480" y="-10" width="14" height="14" fill="#EDE7F6" stroke="#4527A0"/>    <text x="500" y="0">Ops + ingestion (scripts/, supabase/)</text>
  </g>
</svg>

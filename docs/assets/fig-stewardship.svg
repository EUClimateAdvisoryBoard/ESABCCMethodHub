<!--
  Stewardship model — CCE5 ↔ EEA IT.
  Two boundary boxes (CCE5 code · EEA IT hosting), a Docker image
  flowing left-to-right between them, and an operational feedback
  loop (bugs, metrics, incident reports) flowing right-to-left.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 560"
     role="img"
     aria-label="Stewardship model — CCE5 ships Docker images, EEA IT hosts them, operational feedback flows back.">
  <title>Stewardship model — CCE5 ships, EEA IT hosts</title>

  <defs>
    <style>
      .h1     { font-family: "Inter", system-ui, sans-serif; font-weight: 700; fill: #3D5584; }
      .h2     { font-family: "Inter", system-ui, sans-serif; font-weight: 700; fill: #3D5584; }
      .sub    { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #5B6B7B; }
      .code   { font-family: "JetBrains Mono", monospace; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .row    { font-family: "Inter", sans-serif; font-size: 12.5px; fill: #3D5584; }
      .bullet { font-family: "Inter", sans-serif; font-size: 12.5px; fill: #3D5584; }

      .cce5-band { fill: #E4ECEE; stroke: #608C95; stroke-width: 1.6; }
      .eea-band  { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 1.6; }
      .tile      { fill: #FFFFFF; stroke: #D9DCDE; stroke-width: 1; }
      .arrow-ship { stroke: #608C95; stroke-width: 2.4; fill: none; }
      .arrow-ops  { stroke: #8A95A3; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="ship-head" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#608C95" />
    </marker>
    <marker id="ops-head" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8A95A3" />
    </marker>
  </defs>

  <!-- Header -->
  <text class="h1" font-size="22" x="60" y="52">Stewardship — who does what</text>
  <text class="sub" font-size="13" x="60" y="78">CCE5 stays the code owner after the handoff. EEA IT runs the container. One flow of images and releases out; one flow of operational signal back.</text>

  <!-- LEFT · CCE5 -->
  <g transform="translate(60, 120)">
    <rect class="cce5-band" x="0" y="0" width="440" height="400" rx="10" />
    <text class="code" font-size="11" fill="#608C95" x="20" y="28">CCE5 · CODE STEWARDSHIP</text>
    <text class="h2" font-size="18" x="20" y="54">Ships features. Owns the code.</text>

    <g transform="translate(20, 80)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Repository</text>
      <text class="row" x="16" y="42">Today: github.com/SebastianFra/MethodHub</text>
      <text class="sub" font-size="11" x="16" y="58">Future: ESABCC or EEA org · CCE5 keeps Maintain</text>
    </g>

    <g transform="translate(20, 160)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Engineering cadence</text>
      <text class="sub" font-size="11" x="16" y="42">PR review · agentic coding pipelines</text>
      <text class="sub" font-size="11" x="16" y="58">Multi-agent reviews · self-hosted CI</text>
    </g>

    <g transform="translate(20, 240)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Data + schema</text>
      <text class="sub" font-size="11" x="16" y="42">Migrations · seed data · pipelines</text>
      <text class="sub" font-size="11" x="16" y="58">GDPR retention + erasure functions</text>
    </g>

    <g transform="translate(20, 320)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Release artefact</text>
      <text class="sub" font-size="11" x="16" y="42">Docker image (multi-stage, ~180 MB)</text>
      <text class="sub" font-size="11" x="16" y="58">Versioned, signed, hosted by CCE5 CI</text>
    </g>
  </g>

  <!-- MIDDLE · Flow arrows -->
  <g>
    <!-- Ship arrow: CCE5 → EEA -->
    <path class="arrow-ship" d="M 505 225 C 580 225, 620 225, 695 225" marker-end="url(#ship-head)" />
    <text class="code" font-size="11" fill="#608C95" x="540" y="210">DOCKER IMAGE</text>
    <text class="sub" font-size="11" x="540" y="245">release · tag · signed</text>

    <!-- Ops feedback arrow: EEA → CCE5 -->
    <path class="arrow-ops" d="M 695 340 C 620 340, 580 340, 505 340" marker-end="url(#ops-head)" />
    <text class="code" font-size="11" fill="#8A95A3" x="540" y="325">OPS SIGNAL</text>
    <text class="sub" font-size="11" x="540" y="360">incidents · metrics · bug reports</text>
  </g>

  <!-- RIGHT · EEA IT -->
  <g transform="translate(700, 120)">
    <rect class="eea-band" x="0" y="0" width="440" height="400" rx="10" />
    <text class="code" font-size="11" fill="#BF360C" x="20" y="28">EEA IT · HOSTING</text>
    <text class="h2" font-size="18" x="20" y="54">Runs the service. Owns the ops.</text>

    <g transform="translate(20, 80)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Infrastructure</text>
      <text class="sub" font-size="11" x="16" y="42">Container host (Podman / OpenShift / Nomad / VM)</text>
      <text class="sub" font-size="11" x="16" y="58">Reverse proxy + TLS on EEA domain</text>
    </g>

    <g transform="translate(20, 160)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Data plane</text>
      <text class="sub" font-size="11" x="16" y="42">Postgres 14+ (EEA-managed, RLS, backups)</text>
      <text class="sub" font-size="11" x="16" y="58">Optional S3 / MinIO for PDFs</text>
    </g>

    <g transform="translate(20, 240)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Identity &amp; secrets</text>
      <text class="sub" font-size="11" x="16" y="42">OIDC via EU Login / Azure AD</text>
      <text class="sub" font-size="11" x="16" y="58">Secret store · rotation · key custody</text>
    </g>

    <g transform="translate(20, 320)">
      <rect class="tile" x="0" y="0" width="400" height="62" rx="5" />
      <text class="row" font-weight="600" x="16" y="22">Day-2 operations</text>
      <text class="sub" font-size="11" x="16" y="42">Monitoring · backups · patching</text>
      <text class="sub" font-size="11" x="16" y="58">Incident response</text>
    </g>
  </g>

  <!-- Footer note -->
  <text class="sub" font-size="12" x="60" y="540">This mirrors how github.com/eea already operates — code in the open, services in-region. There is no policy conflict and nothing exotic to arrange.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90" role="img" aria-label="MethodHub">
  <!--
    MethodHub brand mark — charcoal-sketch "suitcase of tools".
    Same artwork as the MethodHubLogo component in
    src/components/SiteHeader.tsx, extracted here as a standalone file
    so the docs site header can render the identical icon.
  -->
  <defs>
    <filter id="mh-charcoal" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="6" />
      <feDisplacementMap in="SourceGraphic" scale="0.9" />
    </filter>
  </defs>
  <g filter="url(#mh-charcoal)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="2.6">
      <path d="M 40 14 Q 50 5 60 14" />
      <rect x="12" y="18" width="76" height="66" rx="3" />
      <line x1="12" y1="30" x2="88" y2="30" />
      <rect x="28" y="21" width="7" height="9" />
      <rect x="65" y="21" width="7" height="9" />
    </g>
    <g fill="#FFFFFF" stroke="none" transform="rotate(45 50 56)">
      <path d="M 42 32 L 58 32 L 58 44 L 54 44 L 54 36 L 46 36 L 46 44 L 42 44 Z" />
      <rect x="47" y="42" width="6" height="28" />
      <circle cx="50" cy="74" r="7" />
      <circle cx="50" cy="74" r="3" fill="#2C3E4D" />
    </g>
    <g fill="#FFFFFF" stroke="none" transform="rotate(-45 50 56)">
      <rect x="44" y="28" width="12" height="16" rx="2" />
      <rect x="44" y="28" width="12" height="16" rx="2" fill="none" stroke="#2C3E4D" stroke-width="0.8" />
      <line x1="48" y1="30" x2="48" y2="42" stroke="#2C3E4D" stroke-width="0.8" />
      <line x1="52" y1="30" x2="52" y2="42" stroke="#2C3E4D" stroke-width="0.8" />
      <rect x="46" y="44" width="8" height="3" />
      <rect x="48" y="47" width="4" height="28" />
      <path d="M 46 75 L 54 75 L 52 80 L 48 80 Z" />
    </g>
  </g>
</svg>
